services:
  - type: web
    name: online-marketplace
    runtime: node
    plan: free
    buildCommand: npm install && npm run build && npm run db:migrate
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: marketplace-db
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false

databases:
  - name: marketplace-db
    plan: free
    databaseName: marketplace
    ipAllowList: []
